server {
  listen 443 ssl;
  server_name morelidev.com www.morelidev.com;

  if ($host = www.morelidev.com) {
    return 301 https://morelidev.com$request_uri;
  }

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /empresa-capixaba {
    return 301 /empresa-capixaba/;
  }

  location ^~ /empresa-capixaba/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Métricas próprias (web/src/lib/analytics.ts): o beacon vira só uma linha
  # neste log, lida pelo painel. Sem cookies e sem nada guardado na aplicação.
  location = /e {
    access_log /var/log/nginx/morelidev/analytics.log;
    add_header Cache-Control "no-store" always;
    return 204;
  }

  # Painel privado de acessos (deploy/painel), protegido por senha.
  location = /painel {
    return 301 /painel/;
  }

  location ^~ /painel/ {
    alias /var/www/morelidev-painel/;
    index index.html;
    auth_basic "Painel MoreliDev";
    auth_basic_user_file /etc/nginx/morelidev-painel.htpasswd;

    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }

  ssl_certificate /etc/letsencrypt/live/morelidev.com-0001/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/morelidev.com-0001/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  listen 80;
  server_name morelidev.com www.morelidev.com;
  return 301 https://morelidev.com$request_uri;
}
